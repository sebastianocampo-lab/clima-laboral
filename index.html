<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,sans-serif;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Auditoría de Clima</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Tablero de control: barra de estado fija, estación al centro, medidores que reaccionan a cada decisión. */
:root{
  --bg:#F3F6F6;
  --surface:#FFFFFF;
  --surface-2:#EBF0EF;
  --fg:#141F1E;
  --muted:#586A67;
  --line:#D6E0DE;
  --accent:#0B6B63;
  --accent-soft:#DEEFEC;
  --good:#1C7A4F;
  --warn:#8F5E0C;
  --bad:#B03529;
  /* un color propio por factor del clima */
  --f-comunicacion:#2A6FC4;
  --f-liderazgo:#7A4FBF;
  --f-reconocimiento:#C77A14;
  --f-equipo:#0F8E78;
  --f-condiciones:#C04A3C;
  --f-crecimiento:#4A8B2E;
  --shadow:0 1px 2px rgba(16,32,30,.06),0 10px 28px rgba(16,32,30,.07);
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1615; --surface:#15211F; --surface-2:#1D2B29; --fg:#E7EFEC; --muted:#92A5A1;
    --line:#273833; --accent:#44C4AC; --accent-soft:#113029;
    --good:#4ECB8F; --warn:#E0A33C; --bad:#F07A68;
    --f-comunicacion:#6BA8EE; --f-liderazgo:#B08EE8; --f-reconocimiento:#E8AE55;
    --f-equipo:#45C9AF; --f-condiciones:#EE8778; --f-crecimiento:#8FC96F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1615; --surface:#15211F; --surface-2:#1D2B29; --fg:#E7EFEC; --muted:#92A5A1;
  --line:#273833; --accent:#44C4AC; --accent-soft:#113029;
  --good:#4ECB8F; --warn:#E0A33C; --bad:#F07A68;
  --f-comunicacion:#6BA8EE; --f-liderazgo:#B08EE8; --f-reconocimiento:#E8AE55;
  --f-equipo:#45C9AF; --f-condiciones:#EE8778; --f-crecimiento:#8FC96F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.14}
p{margin:0}
button{font:inherit;cursor:pointer}
svg{display:block}
.wrap{max-width:760px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 52px}

/* ---- barra superior ---- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:9px}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.brand svg{width:18px;height:18px}
.steps{display:flex;gap:6px;flex:1;min-width:0}
.step{height:6px;flex:1;background:var(--line);border-radius:3px;transition:background .3s}
.step.done{background:var(--accent)}
.step.now{background:var(--accent);opacity:.45}
.clock{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.clock svg{width:14px;height:14px}
.clock.low{color:var(--bad);font-weight:600}

/* ---- bloques ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:20px}
.stack.tight{gap:12px}
.eyebrow{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--muted)}
.hint{font-size:14px;color:var(--muted)}
.center{text-align:center}

/* ---- portada ---- */
.hero{display:grid;gap:18px;padding-block:26px 6px;justify-items:center;text-align:center}
.hero-art{width:100%;max-width:340px}
.hero h1{font-size:clamp(32px,9vw,50px);font-weight:800;letter-spacing:-.025em}
.hero .sub{font-family:var(--display);font-size:clamp(16px,4vw,19px);font-weight:500;color:var(--muted);max-width:30ch}

/* ---- cómo funciona ---- */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.flow-step{background:var(--surface-2);border-radius:12px;padding:16px;display:grid;gap:9px;justify-items:center;text-align:center;position:relative}
.flow-step svg.art{width:76px;height:76px}
.flow-step .n{position:absolute;top:10px;left:12px;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent)}
.flow-step h3{font-size:16px}
.flow-step p{font-size:14px;color:var(--muted)}

/* ---- formulario ---- */
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:14px;font-weight:600}
input[type=text],input[type=number],textarea{font:inherit;background:var(--surface-2);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:11px 12px;width:100%}
input[type=number]{font-family:var(--mono);font-size:20px;font-weight:600;text-align:center}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}

/* ---- botones ---- */
.btn{background:var(--accent);color:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:13px 22px;font-family:var(--display);font-weight:600;font-size:16px;display:inline-flex;align-items:center;gap:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:9px 15px;font-size:14px}
.btn svg{width:16px;height:16px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* ---- cabecera de estación ---- */
.st-head{display:flex;gap:14px;align-items:flex-start}
.st-badge{width:52px;height:52px;border-radius:13px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.st-badge svg{width:28px;height:28px}
.st-head h2{font-size:clamp(21px,5vw,27px);font-weight:700;letter-spacing:-.01em}

/* ---- factor ---- */
.f-chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fc)}
.f-chip svg{width:17px;height:17px}
.f-dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:color-mix(in srgb, var(--fc) 15%, transparent)}
.f-dot svg{width:18px;height:18px}

/* ---- tabla encuesta ---- */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:center;width:1%;white-space:nowrap}
.faces{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.face{display:grid;gap:5px;justify-items:center;flex:1;min-width:52px}
.face svg{width:36px;height:36px}
.face .v{font-family:var(--mono);font-weight:600;font-size:15px}
.face .w{font-size:11px;color:var(--muted)}
.suma{display:flex;align-items:baseline;gap:8px;justify-content:center;font-family:var(--mono);font-size:15px;background:var(--surface-2);border-radius:9px;padding:9px 12px}
.suma b{font-family:var(--display);font-size:22px}

/* ---- medidor semáforo ---- */
.gauge{display:grid;gap:7px}
.gauge-bar{position:relative;height:16px;border-radius:9px;overflow:hidden;
  background:linear-gradient(to right,var(--bad) 0%,var(--bad) 60%,var(--warn) 60%,var(--warn) 80%,var(--good) 80%,var(--good) 100%)}
.gauge-mark{position:absolute;top:-4px;width:4px;height:24px;background:var(--fg);border-radius:2px;transition:left .35s cubic-bezier(.2,.8,.3,1);box-shadow:0 0 0 2px var(--surface)}
.gauge-legend{display:flex;justify-content:space-between;font-size:11px;font-family:var(--mono);color:var(--muted)}
.gauge-read{font-family:var(--display);font-weight:700;font-size:15px;text-align:center;min-height:22px}

/* ---- opciones ---- */
.opts{display:grid;gap:8px}
.opts.cols2{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface-2);color:var(--fg);border:1.5px solid transparent;border-radius:10px;padding:11px 13px;font-size:15px;width:100%;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--fc,var(--accent))}
.opt.sel{border-color:var(--fc,var(--accent));background:color-mix(in srgb, var(--fc,var(--accent)) 13%, transparent)}
.opt .tick{width:17px;height:17px;border-radius:50%;border:2px solid var(--line);flex:none;transition:background .15s,border-color .15s}
.opt.sel .tick{border-color:var(--fc,var(--accent));background:var(--fc,var(--accent))}
.opt svg{width:18px;height:18px;flex:none}

/* ---- testimonio ---- */
.speech{display:flex;gap:12px;align-items:flex-start}
.avatar{width:50px;height:50px;border-radius:50%;flex:none;overflow:hidden}
.bubble{background:var(--surface-2);border-radius:4px 14px 14px 14px;padding:13px 15px;flex:1;min-width:0;position:relative}
.bubble p{font-size:17px;line-height:1.45}
.bubble .who{display:block;font-size:12px;color:var(--muted);margin-top:7px;font-family:var(--mono)}

/* ---- indicadores ---- */
.ind{display:grid;gap:9px}
.ind-row{display:grid;grid-template-columns:30px minmax(84px,1fr) 2fr auto;gap:9px;align-items:center;font-size:14px}
.ind-row .nm{min-width:0;overflow-wrap:break-word}
.bar{height:11px;background:var(--surface-2);border-radius:6px;overflow:hidden;min-width:0}
.bar i{display:block;height:100%;border-radius:6px;background:var(--fc);transition:width .45s cubic-bezier(.2,.8,.3,1)}
.pct{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;white-space:nowrap;min-width:72px;text-align:right}
.s-good{color:var(--good)} .s-warn{color:var(--warn)} .s-bad{color:var(--bad)}
.delta{font-size:12px;font-weight:600}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.tagcrit{font-family:var(--display);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--bad);
  border:1px solid var(--bad);border-radius:999px;padding:1px 7px;white-space:nowrap}

/* ---- marcador de clima ---- */
.score-strip{display:flex;align-items:center;gap:14px;background:var(--accent-soft);border-radius:12px;padding:13px 16px}
.score-strip .ring{width:62px;height:62px;flex:none}
.score-strip .txt{display:grid;gap:1px;min-width:0}
.score-strip .big{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1}
.score-strip .cap{font-size:13px;color:var(--muted)}

/* ---- presupuesto ---- */
.budget{display:flex;align-items:center;gap:12px}
.coins{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.coin{width:17px;height:17px;border-radius:50%;background:var(--accent);transition:background .2s,opacity .2s}
.coin.off{background:var(--line)}
.budget .n{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}

/* ---- acciones ---- */
.act{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface-2);border:1.5px solid transparent;border-radius:11px;padding:13px;width:100%;color:var(--fg);transition:border-color .15s,background .15s,opacity .2s}
.act:hover{border-color:var(--accent)}
.act.sel{border-color:var(--accent);background:var(--accent-soft)}
.act.off{opacity:.42}
.act .box{width:19px;height:19px;border:2px solid var(--line);border-radius:6px;flex:none;margin-top:2px;display:grid;place-items:center}
.act .box svg{width:12px;height:12px;opacity:0;transition:opacity .15s}
.act.sel .box{background:var(--accent);border-color:var(--accent)}
.act.sel .box svg{opacity:1}
.act .t{font-weight:600;font-size:15px;display:block}
.act .meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:6px}
.cost{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.eff{font-family:var(--mono);font-size:11px;border-radius:999px;padding:1px 8px;color:var(--surface);background:var(--fc)}
.eff.neg{background:var(--bad)}
.eff.none{background:transparent;color:var(--muted);border:1px dashed var(--line)}

/* ---- fases ---- */
.phase-item{border:1px solid var(--line);border-radius:11px;padding:13px;background:var(--surface-2);display:grid;gap:10px}
.phase-item .txt{font-size:15px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:9px 6px;font-size:13px;font-family:var(--display);font-weight:600;color:var(--fg);display:grid;gap:4px;justify-items:center;transition:all .15s}
.chip svg{width:17px;height:17px}
.chip.sel{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* ---- resultado ---- */
.final-ring{width:168px;height:168px;margin:0 auto}
.verdict{font-family:var(--display);font-weight:700;font-size:19px}
.break{display:grid;gap:11px}
.break-row{display:grid;grid-template-columns:30px 1fr auto;gap:11px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line);font-size:15px}
.break-row:last-child{border-bottom:0;padding-bottom:0}
.break-row .lbl{display:flex;flex-direction:column;min-width:0}
.break-row .lbl small{color:var(--muted);font-size:13px}
.minibar{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:5px}
.minibar i{display:block;height:100%;border-radius:4px;transition:width .6s ease}
.code{font-family:var(--mono);font-size:14px;background:var(--surface-2);border:1px dashed var(--line);border-radius:9px;padding:13px;word-break:break-word;user-select:all}
.fb{display:grid;gap:9px}
.fb-item{display:grid;grid-template-columns:20px 1fr;gap:9px;font-size:14px;color:var(--muted);align-items:start}
.fb-item svg{width:18px;height:18px;margin-top:2px}
.fb-item b{color:var(--fg);font-weight:600}
.ok{color:var(--good)} .no{color:var(--bad)}

/* ---- panel ---- */
.pill{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.pill.ok{color:var(--good);border-color:var(--good)}
.pill.no{color:var(--bad);border-color:var(--bad)}
footer{padding-block:30px 0;text-align:center;font-size:13px;color:var(--muted);display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:0;font-family:inherit}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .28s cubic-bezier(.2,.9,.3,1.2) both}
/* ---- estación 1: la foto ---- */
.nota{background:var(--accent-soft);border:1px solid transparent;display:grid;gap:5px}
.nota-t{font-family:var(--display);font-weight:700;font-size:15px;color:var(--accent);display:flex;align-items:center;gap:7px}
.nota-t svg{width:17px;height:17px}
.nota-d{font-size:15px}
.foto{display:grid;gap:7px}
.foto-row{display:grid;grid-template-columns:30px minmax(72px,1fr) auto;gap:9px;align-items:center;
  background:var(--surface-2);border-radius:10px;padding:7px 10px}
.foto-nm{font-size:14px;font-weight:600;min-width:0;overflow-wrap:break-word}
.cars{display:flex;gap:3px;flex:none}
.cars svg{width:25px;height:25px}
.preg{font-size:18px;font-weight:700}
@media (max-width:400px){ .cars svg{width:21px;height:21px} .foto-row{gap:6px;padding:6px 8px} }
tr.grp td{background:var(--accent-soft);padding:9px 10px;border-bottom:1px solid var(--line)}
.grp-nm{font-family:var(--display);font-weight:700;font-size:14px;color:var(--accent);margin-right:9px}
.grp-meta{font-size:12px;color:var(--muted);font-family:var(--mono)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){
  .ind-row{grid-template-columns:26px minmax(70px,1fr) 1.4fr auto}
  .pct{min-width:62px;font-size:13px}
}

/* ---- estado de guardado ---- */
.save{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:11px;padding:14px;flex-wrap:wrap}
.save svg{width:22px;height:22px;flex:none;margin-top:1px}
.save .save-txt{display:grid;gap:2px;flex:1;min-width:160px}
.save .save-txt b{font-family:var(--display);font-size:16px}
.save .save-txt span{font-size:14px;color:var(--muted)}
.save.ok{background:color-mix(in srgb, var(--good) 13%, transparent)}
.save.ok svg{color:var(--good)}
.save.err{background:color-mix(in srgb, var(--bad) 13%, transparent)}
.save.err svg{color:var(--bad)}
.save.wait svg{color:var(--muted)}
/* ---- tablero ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.kpi{display:grid;gap:2px;justify-items:center;text-align:center;background:var(--surface-2);border-radius:11px;padding:14px 10px}
.kpi .kv{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em}
.kpi .kc{font-size:12px;color:var(--muted)}
.qr-holder{display:grid;place-items:center;padding:16px;background:#FFFFFF;border-radius:12px;margin:0 auto;width:fit-content}
.qr-holder img,.qr-holder canvas{display:block}
.qr-url{font-family:var(--mono);font-size:15px;word-break:break-all}
</style>

</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <span class="brand" id="brand"></span>
    <div class="steps" id="steps" hidden></div>
    <span class="clock" id="clock" hidden></span>
  </div>
</div>

<div class="wrap">
  <section id="view-intro"></section>
  <section id="view-quiz" hidden>
    <div class="stack" style="margin-top:20px" id="station"></div>
    <div class="actions" style="margin-top:22px">
      <button class="btn" id="next">Continuar</button>
      <span class="hint" id="next-hint"></span>
    </div>
  </section>
  <section id="view-result" hidden><div class="stack" style="margin-top:24px" id="result"></div></section>
  <section id="view-panel" hidden>
    <div class="stack" style="margin-top:24px">
      <div>
        <p class="eyebrow">Uso del expositor</p>
        <h1 style="font-size:28px">Tablero en vivo</h1>
        <p class="lede" style="margin-top:8px">Los resultados llegan solos a medida que el curso va terminando la auditoría.</p>
      </div>
      <div class="card stack tight">
        <div class="actions">
          <button class="btn small" id="qr-btn">Mostrar QR</button>
          <button class="btn small ghost" id="refrescar">Actualizar</button>
          <button class="btn small ghost" id="csv-btn">Descargar CSV</button>
          <span class="spacer"></span>
          <button class="link" id="back-intro">Volver</button>
        </div>
        <p class="hint" id="panel-status">Cargando…</p>
      </div>
      <div id="qr-box" hidden></div>
      <div id="panel-out"></div>

/* ---------- validación ---------- */
function completa(i){
  var d = S.datos;
  if (i === 0){
    if (!S.resp.e1peor) return "Falta decir cuál es el problema más grave.";
    if (!S.resp.e1mejor) return "Falta decir qué es lo que mejor funciona.";
    if (S.resp.e1como === undefined) return "Falta la última pregunta.";
    if (S.resp.e1peor === S.resp.e1mejor) return "El peor y el mejor no pueden ser el mismo factor. Mire otra vez la foto.";
  }
  if (i === 1) for (var j=0;j<d.testimonios.length;j++) if (!S.resp["e2_"+j]) return "Falta responder la frase " + (j+1) + " de " + d.testimonios.length + ".";
  if (i === 2 && (!S.resp.e3 || !S.resp.e3.length)) return "Escoja al menos una acción.";
  if (i === 3) for (var m=0;m<d.tareas.length;m++) if (!S.resp["e4_"+m]) return "Falta clasificar la tarea " + (m+1) + " de " + d.tareas.length + ".";
  return "";
}

/* ---------- calificación ---------- */
function calificar(){
  var d = S.datos, det = [], e1=0,e2=0,e3=0,e4=0;
  var F = d.foto;
  function pctDe(k){ return Math.round(F.sumas[k] / 30 * 100); }
  var okPeor = S.resp.e1peor === F.peor;
  if (okPeor) e1 += 10;
  det.push({ ok:okPeor, txt: okPeor
    ? "Identificó bien el problema más grave: " + FACTORES[F.peor].toLowerCase() + ", que en la escala queda en " + pctDe(F.peor) + " % y eso es zona roja."
    : "El problema más grave era " + FACTORES[F.peor].toLowerCase() + ", con " + pctDe(F.peor) + " % en la escala. Usted señaló " + FACTORES[S.resp.e1peor].toLowerCase() + "." });
  var okMejor = S.resp.e1mejor === F.mejor;
  if (okMejor) e1 += 7;
  det.push({ ok:okMejor, txt: okMejor
    ? "Vio bien que " + FACTORES[F.mejor].toLowerCase() + " está sano (" + pctDe(F.mejor) + " %): ahí no hay que gastar presupuesto."
    : "Lo que mejor funcionaba era " + FACTORES[F.mejor].toLowerCase() + " con " + pctDe(F.mejor) + " %. Reconocerlo evita gastar plata donde no hace falta." });
  var okComo = COMO[S.resp.e1como] && COMO[S.resp.e1como].ok;
  if (okComo) e1 += 8;
  det.push({ ok:okComo, txt: okComo
    ? "Correcto: el clima se conoce preguntándole a la gente, no suponiendo."
    : "El clima laboral se diagnostica con una encuesta a los trabajadores. Ni las ventas ni la intuición del jefe sirven para medirlo." });
  d.testimonios.forEach(function(t, i){
    var ok = S.resp["e2_"+i] === t.f;
    if (ok) e2 += 5;
    det.push({ ok:ok, txt: "“" + t.t.slice(0,46) + "…” era " + FACTORES[t.f] + (ok ? "." : ", usted marcó " + FACTORES[S.resp["e2_"+i]] + ".") });
  });
  var sel = S.resp.e3 || [];
  var critico = sel.indexOf("canal") >= 0 || sel.indexOf("reunion") >= 0;
  var control = sel.indexOf("medir") >= 0;
  var trampa = sel.indexOf("bonos") < 0;
  var desperdicio = sel.indexOf("equipos") < 0 && sel.indexOf("contratar") < 0;
  if (critico) e3 += 10; if (control) e3 += 8; if (trampa) e3 += 6; if (desperdicio) e3 += 6;
  det.push({ ok:critico, txt: critico ? "Atacó primero comunicación, el único factor en estado crítico."
    : "No intervino comunicación, que estaba por debajo del 60 %. Ahí estaba la prioridad." });
  det.push({ ok:control, txt: control ? "Incluyó la medición de seguimiento: sin eso no existe la fase de control."
    : "No repitió la encuesta. Como no mueve ninguna barra parece inútil, pero sin medir después nadie sabe si el plan sirvió." });
  det.push({ ok:trampa, txt: trampa ? "Evitó el bono individual, que sube reconocimiento pero rompe el trabajo en equipo."
    : "El bono individual sube reconocimiento 8 puntos y baja trabajo en equipo 7: genera competencia entre compañeros." });
  det.push({ ok:desperdicio, txt: desperdicio ? "No gastó presupuesto en lo que ya estaba en verde."
    : "Gastó en condiciones laborales, que ya estaba bien, o en contratar sin que el caso lo justificara." });
  d.tareas.forEach(function(t, i){
    var ok = S.resp["e4_"+i] === t.f;
    if (ok) e4 += 5;
    det.push({ ok:ok, txt: t.t.slice(0,46) + "… es " + t.f + (ok ? "." : ", usted marcó " + S.resp["e4_"+i] + ".") });
  });
  var proy = {}; FKEYS.forEach(function(k){ proy[k] = d.empresa.ind[k]; });
  sel.forEach(function(id){
    var A = ACCIONES.filter(function(x){ return x.id===id; })[0];
    Object.keys(A.ef).forEach(function(k){ proy[k] = Math.max(0, Math.min(100, proy[k] + A.ef[k])); });
  });
  return { e1:e1, e2:e2, e3:e3, e4:e4, total:e1+e2+e3+e4, det:det, proy:proy, sel:sel };
}
function codigo(nombre, grupo, g){
  return "CLB-" + hash32(norm(nombre)+"|"+norm(grupo)+"|"+g.total+"|"+g.e1+","+g.e2+","+g.e3+","+g.e4).toString(36).toUpperCase().slice(0,4).padStart(4,"0");
}
function lineaResultado(g){
  return S.nombre + " | " + (S.grupo || "sin grupo") + " | " + g.total + "/100 | E1:" + g.e1 + " E2:" + g.e2 + " E3:" + g.e3 + " E4:" + g.e4 + " | " + codigo(S.nombre, S.grupo, g);
}

  if (S.timer){ clearInterval(S.timer); S.timer = null; }
  $("clock").hidden = true; $("steps").hidden = true;

  var e = estado(g.total);

  var head = el("div","card stack tight pop"); head.style.textAlign = "center";

  var cuenta = 0;
  function pinta(v){ ring.innerHTML = anillo(v, 168, 13, "var(--"+e+")") ; var t = ring.querySelector("svg");
    var lab = document.createElementNS("http://www.w3.org/2000/svg","text");

  var br = el("div","card stack tight");

  var list = el("div","break");
  [["medir","Lectura del diagnóstico","Ver qué está grave y qué está sano",g.e1,25],
   ["escuchar","Lectura de testimonios","Identificar qué factor falla",g.e2,20],
   ["decidir","Decisiones con presupuesto","Priorizar, medir y evitar trampas",g.e3,30],
   ["ciclo","Ciclo administrativo","Planeación, organización, dirección, control",g.e4,25]].forEach(function(row){

    r.appendChild(el("span","pct " + (row[3]===row[4] ? "s-good" : row[3] >= row[4]*0.6 ? "s-warn" : "s-bad"), row[3] + "/" + row[4]));

  var pr = el("div","card stack tight");

  pr.appendChild(ind);
  pr.appendChild(el("p","hint","Comparado con la encuesta inicial, después de aplicar las acciones que usted escogió."));

  var fb = el("div","card stack tight");
  fb.appendChild(el("p","eyebrow","Revisión punto por punto"));

  g.det.forEach(function(d){

    } catch(err){ seleccionar(code); msg.textContent = "Seleccionado: copie con el teclado."; }

function seleccionar(node){
  try { var r = document.createRange(); r.selectNodeContents(node);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch(e){}
}

/* ---------- panel del expositor ---------- */
var refrescoAuto = null;
function claveCaso(r){
  var t = String(r.caso || "").trim();
  if (!t) return "Sin grupo";
  var n = t.match(/\d+/);
  return n ? ("Caso " + parseInt(n[0], 10)) : (t.charAt(0).toUpperCase() + t.slice(1));
}
function filaValida(r){
  var g = { total: r.puntaje, e1:r.e1, e2:r.e2, e3:r.e3, e4:r.e4 };
  return codigo(r.nombre || "", r.caso === "sin grupo" ? "" : (r.caso || ""), g) === (r.codigo || "");
}
function pintarPanel(rows){
  var out = $("panel-out"); out.innerHTML = "";
  if (!rows.length){
    var vacio = el("div","card center stack tight");
    vacio.appendChild(el("p","eyebrow","Todavía no ha llegado nadie"));
    vacio.appendChild(el("p","lede","Las filas aparecen solas a medida que el curso termina la auditoría. Proyecte el QR para que entren."));
    out.appendChild(vacio);
    return;
  }
  var prom = Math.round(rows.reduce(function(a,r){ return a + (r.puntaje||0); },0) / rows.length);
  var aprob = rows.filter(function(r){ return (r.puntaje||0) >= 60; }).length;

  var resumen = el("div","card stack tight");
  var kpis = el("div","kpis");
  [[rows.length, "respuestas"], [prom + "/100", "promedio del curso"], [aprob + " de " + rows.length, "por encima de 60"]].forEach(function(k){
    var b = el("div","kpi");
    b.appendChild(el("span","kv", String(k[0])));
    b.appendChild(el("span","kc", k[1]));
    kpis.appendChild(b);
  });
  resumen.appendChild(kpis);
  out.appendChild(resumen);

  var card = el("div","card stack tight");
  card.appendChild(el("p","eyebrow","Resultados"));
  var sc = el("div","scroll"), t = el("table"), th = el("thead"), trh = el("tr");
  ["#","Estudiante","Caso","Puntaje","E1","E2","E3","E4","Tiempo",""].forEach(function(h){ trh.appendChild(el("th", null, h)); });
  th.appendChild(trh); t.appendChild(th);
  var tb = el("tbody");
  var grupos = {};
  rows.forEach(function(r){ var c = claveCaso(r); (grupos[c] = grupos[c] || []).push(r); });
  var claves = Object.keys(grupos).sort(function(a,b){
    var na = parseInt(a.replace(/\D/g,""),10), nb = parseInt(b.replace(/\D/g,""),10);
    if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
    if (isNaN(na) && !isNaN(nb)) return 1;
    if (!isNaN(na) && isNaN(nb)) return -1;
    return a.localeCompare(b, "es");
  });
  claves.forEach(function(c){
    var g = grupos[c].slice().sort(function(a,b){ return (b.puntaje||0) - (a.puntaje||0); });
    var pg = Math.round(g.reduce(function(a,r){ return a + (r.puntaje||0); },0) / g.length);
    var trg = el("tr","grp");
    var tdg = el("td"); tdg.setAttribute("colspan","10");
    tdg.appendChild(el("span","grp-nm", c));
    tdg.appendChild(el("span","grp-meta", g.length + (g.length===1?" estudiante":" estudiantes") + " · promedio " + pg + "/100"));
    trg.appendChild(tdg); tb.appendChild(trg);
    g.forEach(function(r, i){
      var tr = el("tr");
      tr.appendChild(el("td","num", String(i+1)));
      tr.appendChild(el("td", null, r.nombre || "—"));
      tr.appendChild(el("td", null, r.caso || "—"));
      var e = estado(r.puntaje || 0);
      var tdp = el("td","num"); tdp.appendChild(el("span","pct s-"+e, (r.puntaje==null?"—":r.puntaje+"/100"))); tr.appendChild(tdp);
      [r.e1,r.e2,r.e3,r.e4].forEach(function(v){ tr.appendChild(el("td","num", v==null?"—":String(v))); });
      var seg = r.segundos || 0;
      tr.appendChild(el("td","num", seg ? Math.floor(seg/60)+":"+(seg%60<10?"0":"")+(seg%60) : "—"));
      var td = el("td");
      td.appendChild(el("span","pill " + (filaValida(r)?"ok":"no"), filaValida(r) ? "ok" : "revisar"));
      tr.appendChild(td);
      tb.appendChild(tr);
    });
  });
  t.appendChild(tb); sc.appendChild(t); card.appendChild(sc);
  out.appendChild(card);
  out._rows = rows;
}
function cargarPanel(){
  var st = $("panel-status");
  if (!hayBD()){ st.textContent = "Falta configurar Supabase en el archivo (SUPABASE_URL y SUPABASE_KEY)."; return; }
  st.textContent = "Consultando…";
  leerResultados().then(function(rows){
    pintarPanel(rows);
    var h = new Date();
    st.textContent = rows.length + " respuestas · actualizado " + h.getHours() + ":" + (h.getMinutes()<10?"0":"") + h.getMinutes() + " · se refresca solo";
  }, function(err){
    st.textContent = "No se pudo leer la base de datos. Revise la URL, la llave y las políticas de la tabla.";
  });
}
function descargarCSV(){
  var rows = ($("panel-out")._rows) || [];
  if (!rows.length) return;
  var D = ";";
  function q(v){
    if (v == null || v === "") return "";
    var t = String(v);
    if (/^-?\d+$/.test(t)) return t;
    return '"' + t.replace(/"/g,'""') + '"';
  }
  function fila(a){ return a.map(q).join(D); }
  function prom(g){ return Math.round(g.reduce(function(a,r){ return a + (r.puntaje||0); },0) / g.length); }
  function reloj(seg){ seg = seg||0; return Math.floor(seg/60) + ":" + (seg%60<10?"0":"") + (seg%60); }

  var grupos = {};
  rows.forEach(function(r){ var c = claveCaso(r); (grupos[c] = grupos[c] || []).push(r); });
  var claves = Object.keys(grupos).sort(function(a,b){
    var na = parseInt(a.replace(/\D/g,""),10), nb = parseInt(b.replace(/\D/g,""),10);
    if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
    if (isNaN(na) && !isNaN(nb)) return 1;
    if (!isNaN(na) && isNaN(nb)) return -1;
    return a.localeCompare(b, "es");
  });

  var L = ["sep=" + D];
  L.push(fila(["AUDITORIA DE CLIMA LABORAL - RESULTADOS POR GRUPO"]));
  L.push(fila(["Descargado", new Date().toLocaleString("es-CO")]));
  L.push(fila(["Total de respuestas", rows.length]));
  L.push("");

  claves.forEach(function(c){
    var g = grupos[c].slice().sort(function(a,b){ return (b.puntaje||0) - (a.puntaje||0); });
    L.push(fila([c.toUpperCase(), g.length + (g.length===1 ? " estudiante" : " estudiantes"), "Promedio del grupo", prom(g) + "/100"]));
    L.push(fila(["Estudiante","Puntaje","E1 Diagnostico","E2 Testimonios","E3 Decisiones","E4 Ciclo","Tiempo","Codigo","Verificado","Fecha y hora"]));
    g.forEach(function(r){
      L.push(fila([r.nombre, r.puntaje, r.e1, r.e2, r.e3, r.e4, reloj(r.segundos),
                   r.codigo, filaValida(r) ? "si" : "REVISAR",
                   String(r.creado_en||"").replace("T"," ").slice(0,19)]));
    });
    L.push("");
  });

  L.push(fila(["RESUMEN POR GRUPO"]));
  L.push(fila(["Grupo","Estudiantes","Promedio","Mas alto","Mas bajo"]));
  claves.forEach(function(c){
    var ps = grupos[c].map(function(r){ return r.puntaje||0; });
    L.push(fila([c, ps.length, prom(grupos[c]), Math.max.apply(null, ps), Math.min.apply(null, ps)]));
  });
  var todos = rows.map(function(r){ return r.puntaje||0; });
  L.push(fila(["TODO EL CURSO", rows.length, prom(rows), Math.max.apply(null, todos), Math.min.apply(null, todos)]));

  var blob = new Blob(["\ufeff" + L.join("\r\n")], {type:"text/csv;charset=utf-8"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "resultados-clima-laboral.csv";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function mostrarQR(){
  var box = $("qr-box");
  if (!box.hidden){ box.hidden = true; return; }
  box.hidden = false; box.innerHTML = "";
  var url = location.origin + location.pathname;
  var card = el("div","card stack tight center");
  card.appendChild(el("p","eyebrow","Proyecte esto al curso"));
  var holder = el("div","qr-holder"); card.appendChild(holder);
  var u = el("p","qr-url", url.replace(/^https?:\/\//,"")); card.appendChild(u);
  card.appendChild(el("p","hint","Apunten la cámara del celular al código. No necesitan instalar nada ni tener cuenta."));
  box.appendChild(card);
  try {
    new QRCode(holder, { text:url, width:260, height:260, correctLevel: QRCode.CorrectLevel.M });
  } catch(e){
    holder.appendChild(el("p","hint","No se pudo generar el QR. Dicte la dirección de arriba."));
  }
}
