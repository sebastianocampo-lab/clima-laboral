<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica Simulada - Vehículos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 20px; font-size: 18px; }
    .panel {
      background: white;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .panel h2 { font-size: 15px; margin-bottom: 12px; color: #333; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    .form-row { display: flex; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .form-group { display: flex; flex-direction: column; flex: 1; min-width: 140px; }
    .form-group label { font-size: 12px; color: #666; margin-bottom: 3px; }
    .form-group input, .form-group select {
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }
    button {
      background: #2563EB;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #1d4ed8; }
    textarea {
      width: 100%;
      height: 120px;
      font-family: monospace;
      font-size: 13px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
      margin-top: 8px;
    }
    .search-row { display: flex; gap: 10px; align-items: flex-end; }
    .search-row .form-group { flex: 1; }
    .counter { font-size: 12px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Gestión de Vehículos — Práctica Simulada</h1>

    <!-- Panel: Ingresar nuevo vehículo -->
    <div class="panel">
      <h2>Ingresar nuevo vehículo</h2>
      <div class="form-row">
        <div class="form-group">
          <label>Placa</label>
          <input type="text" id="txtPlaca" placeholder="ABC123">
        </div>
        <div class="form-group">
          <label>Propietario</label>
          <input type="text" id="txtPropietario" placeholder="Carlos Mendez">
        </div>
        <div class="form-group">
          <label>Modelo (año)</label>
          <input type="text" id="txtModelo" placeholder="2022">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Póliza</label>
          <input type="text" id="txtPoliza" placeholder="POL-9876">
        </div>
        <div class="form-group">
          <label>Tipo de seguro</label>
          <select id="cboTipo">
            <option value="Basico">Básico</option>
            <option value="Completo">Completo</option>
            <option value="Premium">Premium</option>
            <option value="Todo_Riesgo">Todo Riesgo</option>
          </select>
        </div>
        <div class="form-group">
          <label>Vigencia (año)</label>
          <input type="text" id="txtVigencia" placeholder="2026">
        </div>
      </div>
      <button id="btnIngresar">Ingresar vehículo</button>
      <div class="counter" id="counterMsg">Vehículos registrados: 0</div>
    </div>

    <!-- Panel: Buscar vehículo -->
    <div class="panel">
      <h2>Buscar vehículo por propietario</h2>
      <div class="search-row">
        <div class="form-group">
          <label>Propietario a buscar</label>
          <input type="text" id="txtBuscarPropietario" placeholder="Carlos Mendez">
        </div>
        <button id="btnBuscar">Buscar</button>
      </div>
    </div>

    <!-- Panel: Salida -->
    <div class="panel">
      <h2>Salida</h2>
      <textarea id="aTSalida" readonly placeholder="La información se mostrará aquí..."></textarea>
    </div>
  </div>

  <!-- Scripts en orden -->
  <script src="SeguroVehicular.js"></script>
  <script src="Vehiculo.js"></script>
  <script src="util.js"></script>
  <script src="main.js"></script>
  <script>
    // Actualizar contador al ingresar
    document.getElementById("btnIngresar").addEventListener("click", function() {
      document.getElementById("counterMsg").textContent = "Vehículos registrados: " + losVehiculos.length;
    });
  </script>
</body>
</html>
